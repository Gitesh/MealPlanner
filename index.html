<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Simple Meal Planner</title>

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- globals.css -->
  <link rel="stylesheet" href="global.css">

</head>
<body>
  <header class="app-header">
    <div class="logo">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M16 2a5 5 0 0 1 5 5v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7a5 5 0 0 1 5-5h6z"></path>
        <path d="M12 2v20"></path>
        <path d="M7 2v20"></path>
        <path d="M17 2v20"></path>
      </svg>
    </div>
    <div class="title">
      <h1>Simple Meal Planner</h1>
      <p>Plan your week, one delicious meal at a time.</p>
    </div>
  </header>

  <main class="container">
    <section class="card suggestions-card">
      <h2 id="suggestions-title">5-Day Meal Suggestions</h2>
      <p class="muted">Your dinner plan for the next week. Drag meals from the database to replace.</p>

      <ul id="suggestions-list" class="suggestions-list" aria-live="polite"></ul>

      <div class="controls footer">
        <div class="want-different">
          <p>Want different options?</p>
          <div class="days-options">
            <label><input type="radio" name="days" value="5" checked> 5 Day</label>
            <label><input type="radio" name="days" value="7"> 7 Day</label>
          </div>
        </div>
        <button id="randomise-btn" class="btn highlight-teal">
          <i data-lucide="shuffle"></i>
          Randomise Meals
        </button>
      </div>
    </section>

    <section class="card database-card">
      <h2>Meal Database</h2>
      <p class="muted">Browse all available meals or filter by name and tag.</p>

      <div class="db-controls">
        <input id="search-input" type="search" placeholder="Search meals or tags..." />
        <select id="tag-filter" title="Filter meals by tag">
          <option value="all">all</option>
        </select>
      </div>

      <div class="db-list" id="db-list" aria-live="polite"></div>

      <div class="db-actions">
        <button id="add-meal-open" class="link-btn"><i data-lucide="plus-circle"></i> Add a new meal</button>
      </div>
    </section>
  </main>

  <footer class="footer-actions">
    <label class="link-btn" title="Upload meals">
      <i data-lucide="upload"></i> Upload your own meals
      <input id="import-file" type="file" accept=".json,.csv" class="hidden">
    </label>
    <button id="export-json" class="link-btn"><i data-lucide="download"></i> Export meal database</button>
  </footer>

  <!-- Edit / Add modal -->
  <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="modal-content">
      <h3 id="modal-title">Edit Meal</h3>
      <form id="meal-form">
        <label>Name<input type="text" id="meal-name" required></label>
        <label>Tags (comma separated)<input type="text" id="meal-tags"></label>
        <label>Popularity (0 to 1)<input type="number" id="meal-pop" min="0" max="1" step="0.01" value="0.5"></label>
        <div class="modal-actions">
          <button type="button" id="modal-cancel" class="btn">Cancel</button>
          <button type="submit" id="modal-save" class="btn highlight-yellow"><i data-lucide="save"></i> Save</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast hidden"></div>

  <!-- lucide icons -->
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.264.0/dist/lucide.min.js"></script>
  <script>
    lucide.createIcons();
  </script>
  <script src="app.js"></script>
</body>
</html>
